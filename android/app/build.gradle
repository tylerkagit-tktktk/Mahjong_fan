apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def releaseSigningKeys = [
    "MYAPP_UPLOAD_STORE_FILE",
    "MYAPP_UPLOAD_STORE_PASSWORD",
    "MYAPP_UPLOAD_KEY_ALIAS",
    "MYAPP_UPLOAD_KEY_PASSWORD",
]
def releaseSigningValues = releaseSigningKeys.collectEntries { key ->
    [(key): keystoreProperties.getProperty(key) ?: project.findProperty(key)]
}
def hasReleaseSigningConfig = releaseSigningValues.values().every { it }
def releaseSigningMessage =
    "Missing Android release signing configuration. " +
    "Copy android/keystore.properties.example to android/keystore.properties, " +
    "or supply the required Gradle properties outside version control."

gradle.taskGraph.whenReady { graph ->
    def runsReleaseTask = graph.allTasks.any { task -> task.name.toLowerCase().contains("release") }
    if (runsReleaseTask && !hasReleaseSigningConfig) {
        throw new GradleException(releaseSigningMessage)
    }
}

def googleServicesFile = file("google-services.json")
if (!googleServicesFile.exists()) {
    throw new GradleException(
        "Missing Firebase config: android/app/google-services.json. " +
        "This file is ignored for public-repo safety; copy your local Firebase config into android/app/ before building Android."
    )
}
apply plugin: "com.google.gms.google-services"

react {
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'


android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.tylerkagit.mahjongfan"
    defaultConfig {
        applicationId "com.tylerkagit.mahjongfan"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "2.1.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        release {
            if (hasReleaseSigningConfig) {
                storeFile rootProject.file(releaseSigningValues.MYAPP_UPLOAD_STORE_FILE)
                storePassword releaseSigningValues.MYAPP_UPLOAD_STORE_PASSWORD
                keyAlias releaseSigningValues.MYAPP_UPLOAD_KEY_ALIAS
                keyPassword releaseSigningValues.MYAPP_UPLOAD_KEY_PASSWORD
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
